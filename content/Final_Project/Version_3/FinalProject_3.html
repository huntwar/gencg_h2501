<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sand of Time Visualization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.js"></script>
   <link rel="stylesheet" type="text/css" href="FinalProject_3.css">
</head>

<body>

<div id="controls">
    <h2>⏳ Time Tracker</h2>
    <p>Enter up to 7 tasks and weekly hours.</p>

    <div id="tasks-container"></div>

    <div>
        <button id="add-task-btn">➕ Add Task</button>
        <button id="remove-task-btn">➖ Remove Task</button>
    </div>

    <button id="calculate-btn">📊 Calculate Time Sand</button>

    <div id="legend">
        <h4>Task Legend:</h4>
        <div id="legend-items"></div>
    </div>
</div>

<div id="p5-container"></div>

<script src="FinalProject_3.js"></script>

<script>
/* ---------- TASK MANAGEMENT ---------- */
let taskCount = 0;
const maxTasks = 7;
const minTasks = 1;

const tasksContainer = document.getElementById("tasks-container");
const addBtn = document.getElementById("add-task-btn");
const removeBtn = document.getElementById("remove-task-btn");
const legendItems = document.getElementById("legend-items");

function addTaskField(name="", hours="") {
    if (taskCount >= maxTasks) return;
    taskCount++;

    const div = document.createElement("div");
    div.className = "task-input";
    div.id = `task-${taskCount}`;
    div.innerHTML = `
        <input id="task-name-${taskCount}" placeholder="Task name" value="${name}" style="flex:2">
        <input id="task-hours-${taskCount}" type="number" min="0.1" step="0.1"
               placeholder="hrs/week" value="${hours}" style="flex:1">
    `;
    tasksContainer.appendChild(div);
    updateButtons();
}

function removeTaskField() {
    if (taskCount <= minTasks) return;
    tasksContainer.removeChild(document.getElementById(`task-${taskCount}`));
    taskCount--;
    updateButtons();
}

function updateButtons() {
    addBtn.disabled = taskCount >= maxTasks;
    removeBtn.disabled = taskCount <= minTasks;
}

/* ---------- LEGEND (CALLED BY P5) ---------- */
window.updateLegend = (tasks) => {
    legendItems.innerHTML = "";
    tasks.forEach(t => {
        const row = document.createElement("div");
        row.className = "legend-item";
        row.innerHTML = `
            <div class="color-swatch" style="background:${t.color}"></div>
            ${t.name}
        `;
        legendItems.appendChild(row);
    });
};

/* ---------- DEFAULT TASKS ---------- */
addTaskField("Work", 40);
addTaskField("Sleep", 56);
addTaskField("TV", 20);
addTaskField("Commute", 5);
addTaskField("Hobbies", 10);

addBtn.onclick = () => addTaskField();
removeBtn.onclick = removeTaskField;

document.getElementById("calculate-btn").onclick = () => {
    document.getElementById("p5-container").style.display = "block";
    window.setupVisualization();
};

window.getTaskCount = () => taskCount;
updateButtons();
</script>

</body>
</html>
